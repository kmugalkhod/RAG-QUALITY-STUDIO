services:
  db-test:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: rag_studio_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_test -d rag_studio_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build: ./backend
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://rag_test:isolated-test-only@db-test:5432/rag_studio_test
    command: ["python", "-m", "pytest", "-q"]
    depends_on:
      db-test:
        condition: service_healthy
