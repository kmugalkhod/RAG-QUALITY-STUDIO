<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc"><title id="title">RAG Quality Studio workflow</title><desc id="desc">A source document is prepared into chunks, published as an immutable ready collection, selected by a saved answer pipeline, and used to produce an answer with inspectable citations. Preview is separate from publication.</desc><rect width="1120" height="310" rx="18" fill="#20242b"/><g fill="#17191f" stroke="#a49bd8" stroke-width="2"><rect x="30" y="90" width="175" height="115" rx="12"/><rect x="250" y="90" width="175" height="115" rx="12"/><rect x="470" y="90" width="175" height="115" rx="12"/><rect x="690" y="90" width="175" height="115" rx="12"/><rect x="910" y="90" width="175" height="115" rx="12"/></g><g fill="#eceef3" font-family="Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle"><text x="117" y="142">Document</text><text x="337" y="142">Prepare</text><text x="557" y="142">Collection</text><text x="777" y="142">Pipeline</text><text x="997" y="142">Answer</text></g><g fill="#adb6c4" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="117" y="174">source revision</text><text x="337" y="174">versioned chunks</text><text x="557" y="174">ready index version</text><text x="777" y="174">saved version</text><text x="997" y="174">cited evidence</text></g><g stroke="#adb6c4" stroke-width="3" fill="none"><path d="M210 147h30m-9-9 9 9-9 9M430 147h30m-9-9 9 9-9 9M650 147h30m-9-9 9 9-9 9M870 147h30m-9-9 9 9-9 9"/></g><text x="30" y="45" fill="#a49bd8" font-family="Arial,sans-serif" font-size="16">SYNTHETIC LOCAL EXAMPLE · MODEL ACTIONS REQUIRE CONFIGURATION</text><text x="30" y="265" fill="#adb6c4" font-family="Arial,sans-serif" font-size="15">Preview examines a draft; only a successful run publishes a new ready index.</text></svg>
