# Apply after compose.e2e.yaml. Provider doubles live only in tests/e2e_provider.py.
services:
  backend:
    command: ["uvicorn", "tests.e2e_provider:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CHAT_MODEL: test/chat
      OPENROUTER_API_KEY: test-fixture-not-a-real-key
      EMBEDDING_PROVIDER: openrouter
      EMBEDDING_MODEL: openai/text-embedding-3-small
      EMBEDDING_DIMENSIONS: 1536
      EMBEDDING_BASE_URL: https://openrouter.ai/api/v1
      EMBEDDING_REQUESTS_PER_MINUTE: 60
  worker:
    command: ["python", "-m", "tests.e2e_provider", "worker"]
    environment:
      CHAT_MODEL: test/chat
      OPENROUTER_API_KEY: test-fixture-not-a-real-key
      EMBEDDING_PROVIDER: openrouter
      EMBEDDING_MODEL: openai/text-embedding-3-small
      EMBEDDING_DIMENSIONS: 1536
      EMBEDDING_BASE_URL: https://openrouter.ai/api/v1
      EMBEDDING_REQUESTS_PER_MINUTE: 60
